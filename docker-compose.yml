version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aevorex_db
    environment:
      POSTGRES_DB: aevorex
      POSTGRES_USER: aevorex
      POSTGRES_PASSWORD: aevorex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aevorex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aevorex_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
