[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aevorex-engine"
version = "0.0.0"
description = "AevoraeX property ingestion, valuation, and frozen scoring engine"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["backups", "logs", "venv", "raw.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["aevorex", "main.py"]
exclude = ["^migrations/", "^backups/", "^venv/"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "aevorex.run_tracking",
  "aevorex.freshness.*",
  "aevorex.publisher.*",
]
strict = true
ignore_errors = false

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "database: requires the local PostgreSQL service and rebuilds only aevorex_test",
]

[tool.setuptools.packages.find]
include = ["aevorex*"]
